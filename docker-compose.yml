# Local development stack. Production runs the pony binary under systemd;
# this file is for development and review only.
#
#   cp .env.example .env
#   make db                                     # Postgres, migrated and seeded
#   make up                                     # ...plus Prometheus and Grafana
#   docker compose --profile app up -d --build  # ...plus the API in a container
#
# Every port is published on 127.0.0.1 only. Images are pinned by digest.
name: dancing-pony

x-hardened: &hardened
  security_opt:
    - no-new-privileges:true

# Run as the schema owner. The app itself connects as pony_app.
x-owner-db: &owner-db
  PONY_MIGRATE_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable

services:
  # One-shot: applies migrations as the schema owner, then exits.
  migrate:
    profiles: [app]
    build: .
    image: dancing-pony:dev
    <<: *hardened
    read_only: true
    cap_drop: [ALL]
    command: ["migrate", "up"]
    environment: *owner-db
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: adds the demo restaurants if they are missing, then exits.
  seed:
    profiles: [app]
    build: .
    image: dancing-pony:dev
    <<: *hardened
    read_only: true
    cap_drop: [ALL]
    command: ["seed"]
    environment: *owner-db
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    profiles: [app]
    build: .
    image: dancing-pony:dev
    <<: *hardened
    read_only: true
    cap_drop: [ALL]
    depends_on:
      seed:
        condition: service_completed_successfully
    environment:
      PONY_DATABASE_URL: postgres://pony_app:${PONY_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      PONY_INTERNAL_ADDR: 0.0.0.0:9091
      # Keep the Go heap inside the memory limit below.
      GOMEMLIMIT: 450MiB
    ports:
      - "127.0.0.1:${PONY_PORT:-8080}:8080"
      # Metrics, published on the host so Prometheus finds them at the same
      # address as when the API runs on the host.
      - "127.0.0.1:${PONY_INTERNAL_PORT:-9091}:9091"
    # "Shire server": the size of the production droplet (1 vCPU, 512 MB),
    # so local load tests see production-like limits.
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  postgres:
    image: postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    <<: *hardened
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set it in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?set it in .env (see .env.example)}
      # Used by deploy/postgres/initdb to create the pony_app login role.
      PONY_APP_DB_PASSWORD: ${PONY_APP_DB_PASSWORD:?set it in .env (see .env.example)}
    volumes:
      # Postgres 18 keeps its data in a versioned directory below this path.
      - pgdata:/var/lib/postgresql
      # Run once, when the data volume is first created.
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    # The smallest managed Postgres plan (1 vCPU, 1 GB).
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  prometheus:
    image: prom/prometheus:v3.16.0@sha256:e04987641b57704f408e31f6373ba4138ecf27cb4a165d24aabb6c38fddd0f06
    <<: *hardened
    read_only: true
    # Host networking lets Prometheus scrape the API at 127.0.0.1:9091
    # whether it runs on the host or in a container (Linux; Docker Desktop
    # needs host networking enabled). It still listens on 127.0.0.1 only.
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=127.0.0.1:${PROMETHEUS_PORT:-9090}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    <<: *hardened
    network_mode: host
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in .env (see .env.example)}
      # Local only: view dashboards without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/pony.json
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-9090}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
