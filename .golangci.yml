version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: UK
      # Deliberate typo used to test typo-tolerant search.
      ignore-rules:
        - mushrom
  exclusions:
    rules:
      # Test helpers create their own contexts on purpose; there is no
      # request context to thread through.
      - path: _test\.go
        linters: [contextcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - the-dancing-pony-v2
