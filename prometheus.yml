global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  # pony serve's internal listener (PONY_INTERNAL_ADDR). Prometheus runs on
  # the host network (see docker-compose.yml), so this reaches the API
  # whether it runs on the host (make run) or in the compose "app" profile.
  - job_name: pony
    static_configs:
      - targets: ['127.0.0.1:9091']
