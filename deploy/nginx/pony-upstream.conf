# Installed as /etc/nginx/conf.d/pony-upstream.conf (http context).
#
# Keeps a pool of idle connections from Nginx to pony instead of opening a
# new one per request. Without it every request left a socket in TIME_WAIT
# and a conntrack entry behind; at ~200 requests/s the conntrack table
# filled and the kernel dropped packets ("nf_conntrack: table full").
# Needs proxy_http_version 1.1 and an empty Connection header (pony-proxy.conf).
upstream pony {
    server 127.0.0.1:8080;
    keepalive 32;
    keepalive_requests 10000;
    keepalive_timeout 60s;
}
