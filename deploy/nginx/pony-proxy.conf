# Included in the silson.dev server block (the one certbot manages):
#
#   location / {
#       include /etc/nginx/snippets/pony-proxy.conf;
#   }
proxy_pass http://pony;  # upstream in /etc/nginx/conf.d/pony-upstream.conf
proxy_http_version 1.1;
# Empty, not "close", so the upstream connection is reused (keepalive).
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
# Overwrite, never append: the client's own X-Forwarded-For is untrusted.
# pony believes these only from 127.0.0.1 (PONY_TRUSTED_PROXIES).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
# Photo uploads are up to 10 MiB (the API enforces the exact limit).
client_max_body_size 11m;
proxy_read_timeout 35s;
